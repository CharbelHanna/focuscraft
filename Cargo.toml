[workspace]
members = ["crates/focuscraft-core", "crates/focuscraft-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "AGPL-3.0-or-later"
repository = "https://github.com/charbel-hanna/focuscraft"
authors = ["FocusCraft contributors"]

[workspace.dependencies]
anyhow = "1.0"
image = "0.25.10"
tiff = "0.11.3"
rayon = "1.12"
serde = { version = "1.0", features = ["derive"] }
clap = { version = "4.6", features = ["derive"] }
tempfile = "3"

# Added when the milestone that needs them lands, rather than up front:
#   serde_json  — M5, .focuscraft project files
#   indicatif   — M2, merge progress reporting

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# Image work is unusably slow in an unoptimised build. Dependencies are
# optimised even in dev so that `cargo test` on real frames finishes.
[profile.dev.package."*"]
opt-level = 2
